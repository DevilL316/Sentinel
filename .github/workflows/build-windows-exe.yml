name: Build Windows exe

# Builds a single-file Sentinel.exe, starts it and smoke-tests it, and publishes it.
#   - Run manually:   Actions tab > "Build Windows exe" > Run workflow   (the exe is attached to the run as an artifact)
#   - Make a release: bump __version__ in sentinel/__init__.py, then push a matching tag
#       git tag v0.1.0 && git push origin v0.1.0
#     The exe and its SHA-256 file are attached to a GitHub Release (the build fails if tag and version disagree).
#
# Actions are pinned to commit SHAs (the comment shows the release). Tags like @v7 can be moved by whoever
# controls the action's repository; a SHA cannot. To update one: look up the new release's commit and replace it.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "sentinel/**"
      - "rules/**"
      - "playbooks/**"
      - "ui/**"
      - "tests/**"
      - "requirements-build.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install requirements
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build Sentinel.exe
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      # Fail before building, not after: a v0.2.0 tag must not ship an exe that reports 0.1.0.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app="$(python -c 'from sentinel import __version__; print(__version__)')"
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match sentinel.__version__ ($app). Bump sentinel/__init__.py and re-tag."
            exit 1
          fi
      - name: Install build requirements
        run: python -m pip install -r requirements-build.txt
      # build.py runs PyInstaller, then starts the finished exe twice and checks it over HTTP
      # (key generation, locked API, rules, restart persistence, user-editable rules, --service logging).
      # Tests already ran above.
      - name: Build, smoke-test and hash the exe
        run: python packaging/build.py --skip-tests
      - name: Show result
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          Get-Content dist/Sentinel.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sentinel-windows-x64
          path: |
            dist/Sentinel.exe
            dist/Sentinel.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access. It runs no project code and uses no third-party action:
    # it checks the hash of what the build job produced, then uploads it with the preinstalled gh CLI.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Sentinel-windows-x64
          path: release
      - name: Verify the artifact against its hash
        working-directory: release
        run: sha256sum -c Sentinel.exe.sha256
      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/Sentinel.exe release/Sentinel.exe.sha256 --clobber
          else
            gh release create "$TAG" release/Sentinel.exe release/Sentinel.exe.sha256 \
              --verify-tag --title "$TAG" --generate-notes
          fi
